name: Issuer conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - run: test "$(go env GOVERSION)" = "go1.27.0"
      - run: gofmt -w $(find . -name '*.go' -not -path './.git/*')
      - run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './.git/*'))"
      - run: ./scripts/ci-conformance.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issuer-conformance-${{ github.sha }}
          path: ${{ runner.temp }}/gooo-foundation-issuer
          if-no-files-found: error
          retention-days: 30
